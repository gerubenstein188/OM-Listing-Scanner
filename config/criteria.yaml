  - name: Columbus
    state: OH
    aliases: [Columbus-Marion-Zanesville]
  - name: Nashville
    state: TN
    aliases: [Nashville-Davidson-Murfreesboro]
  - name: Raleigh-Durham
    state: NC
    aliases: [Raleigh, Durham, Research Triangle, RTP]
  - name: Charlotte
    state: NC
    aliases: [Charlotte-Concord-Gastonia]
  - name: Atlanta
    state: GA
    aliases: [Atlanta-Sandy Springs-Alpharetta]
  - name: Tampa
    state: FL
    aliases: [Tampa-St. Petersburg-Clearwater]
  - name: Orlando
    state: FL
    aliases: [Orlando-Kissimmee-Sanford]
  - name: Jacksonville
    state: FL
