# Scrape config defaults (can be overridden per brokerage)
defaults:
  request_delay_seconds: 3        # polite crawl delay between requests
  timeout_seconds: 30
  user_agent: "Mozilla/5.0 (compatible; OM-Scanner/1.0; research bot)"
  max_retries: 2
  pdf_download: true
